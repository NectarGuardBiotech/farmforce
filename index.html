<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NectarGuard Farm Force</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Farm Force">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#0b3a33;font-family:Inter,system-ui,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#edf6f3;
    padding-top:env(safe-area-inset-top)}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;background:linear-gradient(135deg,#0b3a33,#0f9d7a);transition:opacity .4s}
  #splash img{width:96px;height:96px;border-radius:22px}
  #splash p{margin-top:16px;font-size:15px;letter-spacing:.3px}
  #off{display:none;position:fixed;left:0;right:0;top:0;background:#b45309;color:#fff;text-align:center;padding:6px;font-size:13px;z-index:5}
</style>
</head>
<body>
<div id="off">You are offline. Reconnect to use the CRM.</div>
<div id="splash"><img src="icon-192.png" alt=""><p>NectarGuard Farm Force</p></div>
<iframe id="app" title="NectarGuard Farm Force" allow="clipboard-write; camera; microphone"></iframe>
<script>
  // >>> Set this to your Apps Script web app URL (ends with /exec) <<<
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxhrC_4xGvvnvcbzhSMBjcjkge6z-CLprYmWuGRHfF6F14wpBSN4QmSKjuB-LE17XeDog/exec';
  var f = document.getElementById('app');
  f.onload = function(){ document.getElementById('splash').style.opacity = 0;
    setTimeout(function(){ document.getElementById('splash').style.display='none'; }, 450); };
  function go(){ if(navigator.onLine){ f.src = APP_URL; } else { location.href = 'offline.html'; } }
  window.addEventListener('online', function(){ document.getElementById('off').style.display='none'; if(!f.src) go(); });
  window.addEventListener('offline', function(){ document.getElementById('off').style.display='block'; });
  go();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
