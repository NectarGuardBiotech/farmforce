<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NectarGuard Farm Force</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6b57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Farm Force">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#0b3a33;font-family:Inter,system-ui,sans-serif}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;background:linear-gradient(135deg,#0b3a33,#0f9d7a)}
  #splash img{width:96px;height:96px;border-radius:22px}
  #splash p{margin:16px 24px 0;font-size:15px;letter-spacing:.3px;text-align:center}
  #splash button{margin-top:18px;background:#fff;color:#0b6b57;border:0;border-radius:10px;padding:10px 20px;font-size:15px;display:none}
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt=""><p id="msg">Opening NectarGuard Farm Force…</p><button id="retry" onclick="location.reload()">Try again</button></div>
<script>
(function(){
  // NectarGuard Farm Force app shell. Screens and data both come live from the CRM; nothing is stored here.
  var API = 'https://script.google.com/macros/s/AKfycbxhrC_4xGvvnvcbzhSMBjcjkge6z-CLprYmWuGRHfF6F14wpBSN4QmSKjuB-LE17XeDog/exec';
  var KEY = 'ngShell1';

  // Makes the CRM screens talk to the server with fetch (no Google page, no Google sign-in needed).
  function shim(api){
    function post(fn, args){
      return fetch(api, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({fn:fn, args:args}), redirect:'follow'})
        .then(function(r){ return r.text(); })
        .then(function(t){
          var j; try { j = JSON.parse(t); } catch(e) { throw new Error('The server is busy. Please try again.'); }
          if (!j.ok) throw new Error(j.error || 'Server error');
          return j.v;
        });
    }
    function mk(h){
      return new Proxy({}, {get:function(_, k){
        if (k === 'withSuccessHandler') return function(f){ return mk({s:f, f:h.f}); };
        if (k === 'withFailureHandler') return function(f){ return mk({s:h.s, f:f}); };
        return function(){
          var a = [].slice.call(arguments);
          post(k, a).then(function(v){ if (h.s) h.s(v); }, function(e){ if (h.f) h.f(e); else console.error(e); });
        };
      }});
    }
    window.google = {script:{run: mk({})}};
  }
  var HEAD = '<title>NectarGuard Farm Force</title><meta name="theme-color" content="#0b6b57">' +
    '<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon-32.png">' +
    '<link rel="apple-touch-icon" href="apple-touch-icon.png">' +
    '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">' +
    '<meta name="apple-mobile-web-app-title" content="Farm Force"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">' +
    '<script>(' + shim.toString() + ')(' + JSON.stringify(API) + ');<\/script>';

  function render(html){
    html = html.replace(/<head[^>]*>/i, function(m){ return m + HEAD; });
    document.open(); document.write(html); document.close();
  }
  function fetchShell(){
    return fetch(API + '?mode=shell', {redirect:'follow'}).then(function(r){ return r.text(); }).then(function(t){
      if (t.length < 5000 || t.indexOf('NectarGuard') < 0) throw new Error('bad');
      try { localStorage.setItem(KEY, t); } catch(e) {}
      return t;
    });
  }
  function fail(){
    document.getElementById('msg').textContent = navigator.onLine ? 'Could not reach the CRM. Please try again.' : 'You are offline. Reconnect to use the CRM.';
    document.getElementById('retry').style.display = 'inline-block';
  }
  var cached = null; try { cached = localStorage.getItem(KEY); } catch(e) {}
  function afterLoad(fn){ if (document.readyState === 'complete') setTimeout(fn, 0); else window.addEventListener('load', function(){ setTimeout(fn, 0); }); }
  if (cached) { afterLoad(function(){ render(cached); fetchShell().catch(function(){}); }); }   // opens instantly, refreshes for next time
  else fetchShell().then(function(h){ afterLoad(function(){ render(h); }); }).catch(fail);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
